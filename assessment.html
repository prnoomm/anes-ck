<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>แบบประเมินอาการหลังผ่าตัด</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  :root {
    --primary-a: #0D9488;
    --primary-b: #0891B2;
    --bg: #F1F5F4;
    --card: #FFFFFF;
    --text: #0F172A;
    --text-soft: #64748B;
    --border: #E2E8F0;
    --green: #22C55E;
    --amber: #F59E0B;
    --red: #EF4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Sarabun', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 96px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    background: linear-gradient(135deg, var(--primary-a), var(--primary-b));
    color: #fff;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--amber);
    flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.25);
  }
  .dot.online { background: var(--green); }
  .dot.offline { background: var(--red); }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; line-height: 1.3; }
  header p { font-size: 12px; margin: 0; opacity: 0.85; }

  main { max-width: 480px; margin: 0 auto; padding: 20px 16px; }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(15,23,42,0.06);
  }
  .greeting { font-size: 15px; }
  .greeting b { color: var(--primary-a); }
  .section-label {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 12px;
  }
  .pain-face {
    font-size: 56px;
    text-align: center;
    margin-bottom: 8px;
  }
  .pain-number {
    text-align: center;
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .pain-caption {
    text-align: center;
    font-size: 13px;
    color: var(--text-soft);
    margin-bottom: 16px;
  }
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 8px;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--green), var(--amber), var(--red));
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--primary-a);
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--primary-a);
    cursor: pointer;
  }
  .scale-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-soft);
    margin-top: 6px;
  }

  .symptom {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .symptom.checked {
    border-color: var(--primary-a);
    background: #F0FDFA;
  }
  .symptom input { width: 18px; height: 18px; accent-color: var(--primary-a); flex-shrink: 0; }
  .symptom span { font-size: 14px; }

  .normal-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 12px;
    background: #F0FDFA;
    border: 1.5px solid #99F6E4;
    cursor: pointer;
  }
  .normal-toggle input { width: 18px; height: 18px; accent-color: var(--primary-a); }
  .normal-toggle span { font-size: 14px; }

  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(241,245,244,0), var(--bg) 30%);
  }
  .submit-btn {
    max-width: 480px;
    margin: 0 auto;
    display: block;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    font-family: 'Sarabun', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, var(--primary-a), var(--primary-b));
    box-shadow: 0 4px 14px rgba(13,148,136,0.35);
    cursor: pointer;
  }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .loading-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 60vh; color: var(--text-soft); font-size: 14px;
    text-align: center; padding: 0 24px;
  }
</style>
</head>
<body>

<header>
  <div class="dot" id="statusDot"></div>
  <div>
    <h1>Post-Op Pain Delivery &amp; Tele-Anesthesia</h1>
    <p>แบบประเมินอาการหลังผ่าตัด (One-Day Surgery)</p>
  </div>
</header>

<main id="app">
  <div class="loading-screen" id="loadingScreen">กำลังโหลดข้อมูลผู้ป่วย...</div>
</main>

<footer id="footer" style="display:none">
  <button class="submit-btn" id="submitBtn">ส่งแบบประเมิน</button>
</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzVAtLFobWMQy-f8p4JdyXtt4ZF__lo2HQLTN3LHzMItaJTd6Tp-hoYhXZFBDHBACtR/exec";
const LIFF_ID = "2010600975-H831TjoB";

const FACES = ['😄','🙂','🙂','😐','😐','😕','😣','😣','😖','😖','😭'];
const CAPTIONS = [
  'ไม่ปวดเลย','ปวดเล็กน้อยมาก','ปวดเล็กน้อย','ปวดพอรำคาญ','ปวดพอรำคาญ',
  'ปวดปานกลาง','ปวดปานกลางมาก','ปวดมาก','ปวดมาก','ปวดรุนแรง','ปวดรุนแรงที่สุด'
];

const SYMPTOMS = [
  'คลื่นไส้อาเจียนรุนแรง',
  'เลือดซึมแผลมาก',
  'ชาตามแขนขา',
  'มีไข้ > 38°C',
  'ปัสสาวะไม่ออก'
];

let currentHN = null;
let currentLineUserId = null;

// แสดงสถานะแต่ละขั้นบนหน้าจอ (สำหรับ debug ในมือถือที่เปิด console ไม่ได้)
function debugStatus(msg) {
  const el = document.getElementById('loadingScreen');
  if (el) el.textContent = msg;
}

function setStatus(state) {
  const dot = document.getElementById('statusDot');
  dot.className = 'dot' + (state === 'online' ? ' online' : state === 'offline' ? ' offline' : '');
}

// fetch ที่มี timeout กันค้างใน in-app browser ของ LINE
async function fetchWithTimeout(url, options, ms) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms || 10000);
  try {
    const res = await fetch(url, Object.assign({}, options, { signal: controller.signal }));
    return res;
  } finally {
    clearTimeout(timer);
  }
}

async function pingApi() {
  try {
    const res = await fetchWithTimeout(API_URL + '?action=ping', {}, 8000);
    const data = await res.json();
    return data.status === 'ok';
  } catch (err) {
    return false;
  }
}

async function getPatient(lineUserId) {
  const res = await fetchWithTimeout(API_URL + '?action=getPatientByLine&lineUserId=' + encodeURIComponent(lineUserId), {}, 10000);
  return res.json();
}

function renderForm(patient) {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card">
      <div class="greeting">สวัสดีคุณ <b>${patient.name}</b><br>HN: ${patient.hn}</div>
    </div>

    <div class="card">
      <p class="section-label">ระดับความเจ็บปวดของท่านตอนนี้</p>
      <div class="pain-face" id="painFace">😄</div>
      <div class="pain-number" id="painNumber">0</div>
      <div class="pain-caption" id="painCaption">ไม่ปวดเลย</div>
      <input type="range" min="0" max="10" value="0" id="painSlider">
      <div class="scale-labels"><span>0</span><span>5</span><span>10</span></div>
    </div>

    <div class="card">
      <p class="section-label">อาการที่พบ (เลือกได้มากกว่า 1 ข้อ)</p>
      <div id="symptomList"></div>
      <label class="normal-toggle" style="margin-top:12px">
        <input type="checkbox" id="normalActivity">
        <span>ยังสามารถทำกิจวัตรประจำวันได้ตามปกติ</span>
      </label>
    </div>
  `;

  const slider = document.getElementById('painSlider');
  slider.addEventListener('input', () => {
    const v = Number(slider.value);
    document.getElementById('painFace').textContent = FACES[v];
    document.getElementById('painNumber').textContent = v;
    document.getElementById('painCaption').textContent = CAPTIONS[v];
  });

  const list = document.getElementById('symptomList');
  SYMPTOMS.forEach((s, i) => {
    const id = 'symptom_' + i;
    const row = document.createElement('label');
    row.className = 'symptom';
    row.setAttribute('for', id);
    row.innerHTML = '<input type="checkbox" id="' + id + '" value="' + s + '"><span>' + s + '</span>';
    row.querySelector('input').addEventListener('change', (e) => {
      row.classList.toggle('checked', e.target.checked);
    });
    list.appendChild(row);
  });

  document.getElementById('footer').style.display = 'block';
}

function renderNotFound() {
  document.getElementById('app').innerHTML = `
    <div class="card">
      <p class="section-label">ไม่พบข้อมูลผู้ป่วย</p>
      <p style="font-size:14px;color:var(--text-soft)">
        กรุณาติดต่อพยาบาลเพื่อลงทะเบียนผูก LINE กับ HN ของท่านก่อนใช้งาน
      </p>
    </div>
  `;
}

async function submitAssessment() {
  const painScore = Number(document.getElementById('painSlider').value);
  const symptoms = Array.from(document.querySelectorAll('#symptomList input:checked')).map(el => el.value);
  const normalActivity = document.getElementById('normalActivity').checked;

  const confirmResult = await Swal.fire({
    title: 'ยืนยันการส่งแบบประเมิน',
    html: 'ระดับความปวด: <b>' + painScore + '</b>/10<br>อาการที่เลือก: ' + (symptoms.length ? symptoms.join(', ') : 'ไม่มี'),
    icon: 'question',
    showCancelButton: true,
    confirmButtonText: 'ส่งแบบประเมิน',
    cancelButtonText: 'ยกเลิก',
    confirmButtonColor: '#0D9488'
  });

  if (!confirmResult.isConfirmed) return;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'กำลังส่งข้อมูล...';

  try {
    // ใช้ Content-Type: text/plain เพื่อเลี่ยง CORS preflight ที่ Apps Script ไม่รองรับ
    const res = await fetchWithTimeout(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'submitAssessment',
        data: { hn: currentHN, painScore: painScore, symptoms: symptoms, normalActivity: normalActivity, lineUserId: currentLineUserId }
      })
    }, 15000);
    const result = await res.json();

    if (result.error) throw new Error(result.error);

    const colorText = { 'เขียว': 'อาการปกติ พักผ่อนและรับประทานยาตามเวลา', 'เหลือง': 'ระบบแนะนำให้เฝ้าระวังและประเมินซ้ำใน 2 ชั่วโมง', 'แดง': 'ระบบแจ้งทีมแพทย์ให้ติดต่อกลับโดยด่วนแล้ว' };
    await Swal.fire({
      title: 'ส่งแบบประเมินสำเร็จ',
      text: colorText[result.color] || '',
      icon: 'success',
      confirmButtonText: 'ปิดหน้าต่าง',
      confirmButtonColor: '#0D9488'
    });

    if (typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()) {
      liff.closeWindow();
    }
  } catch (err) {
    Swal.fire({ title: 'ส่งข้อมูลไม่สำเร็จ', text: err.message, icon: 'error' });
    btn.disabled = false;
    btn.textContent = 'ส่งแบบประเมิน';
  }
}

async function init() {
  setStatus('loading');

  // 1) liff.init ก่อน (สำคัญที่สุด) แสดงสถานะบนจอทีละขั้น
  try {
    debugStatus('กำลังเริ่มต้น LIFF...');
    await liff.init({ liffId: LIFF_ID });

    if (!liff.isLoggedIn()) {
      debugStatus('กำลังเข้าสู่ระบบ LINE...');
      liff.login();
      return;
    }

    debugStatus('กำลังดึงข้อมูลโปรไฟล์...');
    const profile = await liff.getProfile();
    currentLineUserId = profile.userId;
  } catch (err) {
    setStatus('offline');
    debugStatus('LIFF ผิดพลาด: ' + err.message);
    return;
  }

  // 2) หา HN ที่ผูกกับ LINE นี้
  try {
    debugStatus('กำลังตรวจสอบข้อมูลผู้ป่วย...');
    const patientRes = await getPatient(currentLineUserId);
    setStatus('online');

    if (!patientRes.found) {
      renderNotFound();
      return;
    }

    currentHN = patientRes.hn;
    renderForm(patientRes);
    document.getElementById('submitBtn').addEventListener('click', submitAssessment);
  } catch (err) {
    setStatus('offline');
    debugStatus('เชื่อมต่อระบบไม่สำเร็จ: ' + err.message);
  }
}

init();
</script>
</body>
</html>
