<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ลงทะเบียนผู้ป่วย</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  :root {
    --primary-a: #0D9488;
    --primary-b: #0891B2;
    --bg: #F1F5F4;
    --card: #FFFFFF;
    --text: #0F172A;
    --text-soft: #64748B;
    --border: #E2E8F0;
    --green: #22C55E;
    --amber: #F59E0B;
    --red: #EF4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Sarabun', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 96px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    background: linear-gradient(135deg, var(--primary-a), var(--primary-b));
    color: #fff;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--amber);
    flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.25);
  }
  .dot.online { background: var(--green); }
  .dot.offline { background: var(--red); }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; line-height: 1.3; }
  header p { font-size: 12px; margin: 0; opacity: 0.85; }

  main { max-width: 480px; margin: 0 auto; padding: 20px 16px; }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(15,23,42,0.06);
  }
  .card p.note {
    font-size: 13px;
    color: var(--text-soft);
    margin: 0;
  }
  .section-label {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 14px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-soft);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: 'Sarabun', sans-serif;
    font-size: 15px;
    color: var(--text);
    background: #fff;
  }
  .field input:focus {
    outline: none;
    border-color: var(--primary-a);
  }
  .field-row {
    display: flex;
    gap: 10px;
  }
  .field-row .field { flex: 1; }

  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(241,245,244,0), var(--bg) 30%);
  }
  .submit-btn {
    max-width: 480px;
    margin: 0 auto;
    display: block;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    font-family: 'Sarabun', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, var(--primary-a), var(--primary-b));
    box-shadow: 0 4px 14px rgba(13,148,136,0.35);
    cursor: pointer;
  }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .loading-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 60vh; color: var(--text-soft); font-size: 14px;
    text-align: center; padding: 0 24px;
  }
</style>
</head>
<body>

<header>
  <div class="dot" id="statusDot"></div>
  <div>
    <h1>Post-Op Pain Delivery &amp; Tele-Anesthesia</h1>
    <p>ลงทะเบียนผู้ป่วยก่อนกลับบ้าน (One-Day Surgery)</p>
  </div>
</header>

<main id="app">
  <div class="loading-screen" id="loadingScreen">กำลังเชื่อมต่อระบบ...</div>
</main>

<footer id="footer" style="display:none">
  <button class="submit-btn" id="submitBtn">ลงทะเบียน</button>
</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzVAtLFobWMQy-f8p4JdyXtt4ZF__lo2HQLTN3LHzMItaJTd6Tp-hoYhXZFBDHBACtR/exec";
const LIFF_ID = "2010601132-rlFTYoKE";

let currentLineUserId = null;

// แสดงสถานะแต่ละขั้นบนหน้าจอ (สำหรับ debug ในมือถือที่เปิด console ไม่ได้)
function debugStatus(msg) {
  const el = document.getElementById('loadingScreen');
  if (el) el.textContent = msg;
}

function setStatus(state) {
  const dot = document.getElementById('statusDot');
  dot.className = 'dot' + (state === 'online' ? ' online' : state === 'offline' ? ' offline' : '');
}

// fetch ที่มี timeout กันค้างใน in-app browser ของ LINE
async function fetchWithTimeout(url, options, ms) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms || 10000);
  try {
    const res = await fetch(url, Object.assign({}, options, { signal: controller.signal }));
    return res;
  } finally {
    clearTimeout(timer);
  }
}

async function pingApi() {
  try {
    const res = await fetchWithTimeout(API_URL + '?action=ping', {}, 8000);
    const data = await res.json();
    return data.status === 'ok';
  } catch (err) {
    return false;
  }
}

function nowForDateTimeLocal() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}

function renderForm() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card">
      <p class="note">พยาบาลกรอกข้อมูลผู้ป่วยให้ครบก่อนกดลงทะเบียน ระบบจะผูก LINE ของผู้ป่วยเข้ากับ HN นี้โดยอัตโนมัติ</p>
    </div>

    <div class="card">
      <p class="section-label">ข้อมูลผู้ป่วย</p>

      <div class="field">
        <label for="hn">HN (รหัสผู้ป่วย)</label>
        <input type="text" id="hn" placeholder="เช่น HN00001">
      </div>

      <div class="field">
        <label for="name">ชื่อ-นามสกุล</label>
        <input type="text" id="name" placeholder="เช่น สมชาย ใจดี">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="age">อายุ</label>
          <input type="number" id="age" placeholder="ปี" min="0">
        </div>
        <div class="field">
          <label for="surgeryDoneAt">เวลาผ่าตัดเสร็จ</label>
          <input type="datetime-local" id="surgeryDoneAt">
        </div>
      </div>

      <div class="field">
        <label for="surgery">การผ่าตัด</label>
        <input type="text" id="surgery" placeholder="เช่น ไส้ติ่งอักเสบ">
      </div>

      <div class="field">
        <label for="method">วิธีการผ่าตัด</label>
        <input type="text" id="method" placeholder="เช่น Laparoscopic">
      </div>

      <div class="field">
        <label for="patientPhone">เบอร์โทรผู้ป่วย</label>
        <input type="tel" id="patientPhone" placeholder="08xxxxxxxx">
      </div>

      <div class="field">
        <label for="relativePhone">เบอร์โทรญาติ</label>
        <input type="tel" id="relativePhone" placeholder="08xxxxxxxx">
      </div>
    </div>
  `;

  document.getElementById('surgeryDoneAt').value = nowForDateTimeLocal();
  document.getElementById('footer').style.display = 'block';
}

function getFieldValues() {
  return {
    hn: document.getElementById('hn').value.trim(),
    name: document.getElementById('name').value.trim(),
    age: document.getElementById('age').value,
    surgery: document.getElementById('surgery').value.trim(),
    method: document.getElementById('method').value.trim(),
    patientPhone: document.getElementById('patientPhone').value.trim(),
    relativePhone: document.getElementById('relativePhone').value.trim(),
    surgeryDoneAt: document.getElementById('surgeryDoneAt').value
  };
}

async function submitRegistration() {
  const data = getFieldValues();

  if (!data.hn || !data.name) {
    Swal.fire({ title: 'กรอกข้อมูลไม่ครบ', text: 'กรุณากรอก HN และชื่อ-นามสกุลผู้ป่วย', icon: 'warning' });
    return;
  }

  const confirmResult = await Swal.fire({
    title: 'ยืนยันการลงทะเบียน',
    html: 'HN: <b>' + data.hn + '</b><br>ชื่อ: ' + data.name,
    icon: 'question',
    showCancelButton: true,
    confirmButtonText: 'ลงทะเบียน',
    cancelButtonText: 'ยกเลิก',
    confirmButtonColor: '#0D9488'
  });

  if (!confirmResult.isConfirmed) return;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'กำลังลงทะเบียน...';

  try {
    const res = await fetchWithTimeout(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'registerPatient',
        data: {
          hn: data.hn,
          name: data.name,
          age: data.age,
          surgery: data.surgery,
          method: data.method,
          patientPhone: data.patientPhone,
          relativePhone: data.relativePhone,
          surgeryDoneAt: data.surgeryDoneAt,
          lineUserId: currentLineUserId
        }
      })
    }, 15000);
    const result = await res.json();

    if (result.error) throw new Error(result.error);

    await Swal.fire({
      title: 'ลงทะเบียนสำเร็จ',
      text: 'ผูก LINE นี้กับ HN ' + result.hn + ' เรียบร้อยแล้ว ระบบจะแจ้งเตือนให้ทำแบบประเมินตามรอบเวลาอัตโนมัติ',
      icon: 'success',
      confirmButtonText: 'ปิดหน้าต่าง',
      confirmButtonColor: '#0D9488'
    });

    if (typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()) {
      liff.closeWindow();
    }
  } catch (err) {
    Swal.fire({ title: 'ลงทะเบียนไม่สำเร็จ', text: err.message, icon: 'error' });
    btn.disabled = false;
    btn.textContent = 'ลงทะเบียน';
  }
}

async function init() {
  setStatus('loading');

  // 1) เริ่มจาก liff.init ก่อน (สำคัญที่สุด) แสดงสถานะบนจอทีละขั้น
  try {
    debugStatus('กำลังเริ่มต้น LIFF...');
    await liff.init({ liffId: LIFF_ID });

    if (!liff.isLoggedIn()) {
      debugStatus('กำลังเข้าสู่ระบบ LINE...');
      liff.login();
      return;
    }

    debugStatus('กำลังดึงข้อมูลโปรไฟล์...');
    const profile = await liff.getProfile();
    currentLineUserId = profile.userId;
  } catch (err) {
    setStatus('offline');
    debugStatus('LIFF ผิดพลาด: ' + err.message);
    return;
  }

  // 2) ตรวจการเชื่อมต่อ backend (ถ้า ping ไม่ผ่านก็ยังให้กรอกฟอร์มได้ ไม่ block ทั้งหน้า)
  debugStatus('กำลังเชื่อมต่อระบบ...');
  const apiOk = await pingApi();
  setStatus(apiOk ? 'online' : 'offline');

  renderForm();
  document.getElementById('submitBtn').addEventListener('click', submitRegistration);
}

init();
</script>
</body>
</html>
